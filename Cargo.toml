[package]
name = "remotefs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "remotefs"
path = "src/lib.rs"

[[bin]]
name = "ssh_mount"
path = "src/bin/ssh_mount.rs"

[[bin]]
name = "gdrive_mount"
path = "src/bin/gdrive_mount.rs"

[dependencies]
fuser = "0.17"
ssh2 = "0.9"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
lru = "0.16"
indexmap = "2"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
log = "0.4"
env_logger = "0.11"
libc = "0.2"
rayon = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
